site_name: AI Playwright
site_description: >-
  Gives Drupal AI Agents eyes on a rendered page - a Playwright browser tool for
  Drupal Canvas and Drupal Canvas AI Agents.
site_url: https://project.pages.drupalcode.org/ai_playwright/
repo_url: https://git.drupalcode.org/project/ai_playwright
repo_name: project/ai_playwright
docs_dir: docs
theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - AI Agent tool: ai-agent-tool.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
